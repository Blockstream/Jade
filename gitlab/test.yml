#
# Test stage
#

test_bip85_rsa_key_gen:
  tags: [ ga ]
  stage: test
  dependencies: []
  script:
    - pushd /opt/esp/idf && . ./export.sh && popd
    - (cd tools/bip85_rsa_key_gen && ./test.sh)
    - git diff --exit-code

test_format:
  tags: [ ga ]
  stage: test
  dependencies: []
  script:
    - pushd /opt/esp/idf && . ./export.sh && popd
    - if git grep -I '%zu' main/ libjade/; then echo 'unsupported format spec "zu"'; echo exit 1; fi
    - ./format.sh
    - idf.py reconfigure
    - git diff --exit-code

test_configs:
  tags: [ ga ]
  stage: test
  dependencies: []
  script:
    - ./tools/check_default_configs.sh
    - git diff --exit-code
